<!DOCTYPE html>
<html>

<head>

    <title>Admin Panel</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .admin-box{
            background:white;
            width:400px;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:darkred;
            margin-bottom:20px;
        }

        input{
            width:90%;
            padding:12px;
            margin:10px 0;
            border-radius:8px;
            border:1px solid gray;
            font-size:16px;
        }

        button{
            background:orange;
            color:white;
            border:none;
            padding:12px 20px;
            width:95%;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:orangered;
        }

        #message{
            margin-top:15px;
            font-size:18px;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="admin-box">

        <h1>👨‍💼 Admin Login</h1>

        <input type="text"
        id="username"
        placeholder="Enter Username">

        <input type="password"
        id="password"
        placeholder="Enter Password">

        <button onclick="login()">
            Login
        </button>

        <p id="message"></p>

    </div>

    <!-- CONNECT JAVASCRIPT FILE -->

    <script src="script.js"></script>

</body>

</html>
