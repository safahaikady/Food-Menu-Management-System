<!DOCTYPE html>
<html>

<head>

    <title>QR Digital Menu</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background-image:url("images/restaurant-bg.jpg");
            background-size:cover;
            background-position:center;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .home-box{
            background:rgba(0,0,0,0.7);
            padding:40px;
            border-radius:20px;
            text-align:center;
            color:white;
            width:400px;
        }

        h1{
            font-size:40px;
            margin-bottom:10px;
        }

        p{
            font-size:20px;
            margin-bottom:30px;
        }

        a{
            text-decoration:none;
        }

        button{
            background:orange;
            color:white;
            border:none;
            padding:15px 30px;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
        }

        button:hover{
            background:orangered;
        }

    </style>

</head>

<body>

    <div class="home-box">

        <h1>🍴 Welcome</h1>

        <p>
            Fresh • Hot • Delicious
        </p>

        <a href="menu.html">

            <button>
                View Menu
            </button>

        </a>

    </div>

</body>

</html>
